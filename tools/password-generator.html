<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>密码生成器 - DevTools</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <header><a href="/" class="logo">Dev<span>Tools</span></a><nav><a href="/">首页</a></nav></header>
  <main class="container">
    <a href="../index.html" class="back-link">← 返回工具列表</a>
    <div class="tool-header"><h1>🔑 密码生成器</h1><p>生成强随机密码，所有运算在浏览器本地完成。</p></div>

    <div style="display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-bottom:24px;">
      <div>
        <div class="panel" style="margin-bottom:16px;">
          <label>密码长度：<strong id="len-val">16</strong></label>
          <input type="range" id="length" min="6" max="64" value="16" oninput="updateLen()" style="width:100%;accent-color:var(--highlight);">
        </div>
        <div style="display:flex;flex-direction:column;gap:8px;margin-bottom:16px;">
          <label style="color:var(--text);cursor:pointer;"><input type="checkbox" id="upper" checked onchange="generate()"> 大写字母 (A-Z)</label>
          <label style="color:var(--text);cursor:pointer;"><input type="checkbox" id="lower" checked onchange="generate()"> 小写字母 (a-z)</label>
          <label style="color:var(--text);cursor:pointer;"><input type="checkbox" id="digits" checked onchange="generate()"> 数字 (0-9)</label>
          <label style="color:var(--text);cursor:pointer;"><input type="checkbox" id="symbols" onchange="generate()"> 特殊符号 (!@#$%^&*)</label>
        </div>
        <button class="btn btn-primary" onclick="generate()" style="width:100%;">🔄 重新生成</button>
      </div>
      <div style="display:flex;flex-direction:column;justify-content:center;">
        <label>生成的密码</label>
        <div id="password" style="background:var(--card-bg);border:1px solid var(--border);border-radius:var(--radius);padding:20px;font-family:monospace;font-size:1.4rem;text-align:center;word-break:break-all;min-height:60px;display:flex;align-items:center;justify-content:center;margin-top:8px;"></div>
        <button class="btn btn-secondary" onclick="copyPass()" style="margin-top:12px;">📋 复制到剪贴板</button>
        <div id="strength" style="margin-top:8px;text-align:center;font-size:0.9rem;"></div>
      </div>
    </div>
  </main>
  <script>
    function updateLen() { document.getElementById('len-val').textContent = document.getElementById('length').value; generate(); }
    function generate() {
      const len = +document.getElementById('length').value;
      let chars = '';
      if (document.getElementById('upper').checked) chars += 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
      if (document.getElementById('lower').checked) chars += 'abcdefghijklmnopqrstuvwxyz';
      if (document.getElementById('digits').checked) chars += '0123456789';
      if (document.getElementById('symbols').checked) chars += '!@#$%^&*()_+-=[]{}|;:,.<>?';
      if (!chars) { document.getElementById('password').textContent = '请至少选择一种字符类型'; return; }
      const arr = new Uint32Array(len);
      crypto.getRandomValues(arr);
      let pw = '';
      for (let i = 0; i < len; i++) pw += chars[arr[i] % chars.length];
      document.getElementById('password').textContent = pw;
      // Strength
      const types = [+document.getElementById('upper').checked, +document.getElementById('lower').checked, +document.getElementById('digits').checked, +document.getElementById('symbols').checked].reduce((a,b)=>a+b,0);
      let strength, color;
      if (len < 8) { strength = '弱'; color = '#f66'; }
      else if (len >= 16 && types >= 3) { strength = '强'; color = '#6f6'; }
      else if (len >= 12 && types >= 2) { strength = '中'; color = '#ff6'; }
      else { strength = '弱'; color = '#f66'; }
      document.getElementById('strength').innerHTML = `强度：<span style="color:${color}">${strength}</span>`;
    }
    async function copyPass() {
      const pw = document.getElementById('password').textContent;
      if (!pw) return;
      await navigator.clipboard.writeText(pw);
      const btn = event.target;
      btn.textContent = '✅ 已复制';
      setTimeout(() => btn.textContent = '📋 复制到剪贴板', 1500);
    }
    generate();
  </script>
</body>
</html>
